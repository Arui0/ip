<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이돌 플래너 - 나만의 아이돌을 빛나게 하세요!</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #FFD1DC;
            --main-blue: #AEC6CF;
            --text-color: #5D5D5D;
            --white: #ffffff;
        }

        /* --- 기본 스타일 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jua', sans-serif; }
        body { background-color: var(--main-pink); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(0) rotate(15deg); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* --- 진입 오버레이 --- */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        #overlay.fade-out { display: none; }
        .start-btn { padding: 15px 40px; font-size: 2rem; background: var(--white); color: var(--main-blue); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 0 #89a3ad; margin-top: 20px; }

        /* --- 내비게이션 바 --- */
        nav { position: fixed; top: -100px; left: 0; width: 100%; height: 60px; background: rgba(255, 255, 255, 0.9); display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 1000; border-bottom: 3px solid var(--main-blue); transition: 0.4s; }
        nav.active-nav { top: 0; }
        .nav-link { padding: 5px 12px; border-radius: 15px; cursor: pointer; color: var(--main-blue); font-size: 1.1rem; }
        .nav-link.active { background: var(--main-blue); color: white; }

        /* --- 메인 영역 --- */
        #main-wrapper { width: 100%; max-width: 900px; padding-top: 40px; display: none; flex-direction: column; align-items: center; }
        #main-wrapper.nav-padding { padding-top: 80px; }
        .view { display: none; width: 100%; animation: popIn 0.5s forwards; padding: 15px; }
        .view.active { display: flex; flex-direction: column; align-items: center; }

        /* --- 캐릭터 카드 (공통) --- */
        .profile-list { display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: center; }
        .profile-card { width: 100%; max-width: 500px; background: white; border-radius: 30px; border: 5px solid var(--main-pink); overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .profile-img-box { width: 100%; height: 350px; background: #fffcfd; border-bottom: 5px solid var(--main-pink); }
        .profile-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .profile-info { padding: 20px; }
        .profile-info h3 { font-size: 1.8rem; color: #ff8fa3; margin-bottom: 8px; }

        /* --- SUB 전용 스타일 (여백 및 라벨 제거) --- */
        .sub-card { border-color: var(--main-blue); max-width: 450px; }
        .sub-card .profile-img-box { height: 280px; border-bottom: 4px solid var(--main-blue); }
        .sub-card .profile-info { padding: 12px 20px; text-align: center; }
        .sub-text { font-size: 1.1rem; color: #888; margin-top: 2px; }

        /* --- 버튼 및 박스 --- */
        .content-box { width: 100%; background: var(--white); padding: 30px 15px; border-radius: 35px; border: 6px solid var(--main-pink); margin-bottom: 30px; }
        .back-btn { margin-top: 20px; padding: 10px 30px; background: var(--main-pink); color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 1.1rem; }

        /* --- 모바일 최적화 --- */
        @media (max-width: 480px) {
            .profile-info h3 { font-size: 1.4rem; }
            .sub-text { font-size: 0.95rem; }
            .profile-img-box { height: 250px; }
            .sub-card .profile-img-box { height: 220px; }
            .nav-link { font-size: 0.9rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="overlay-content">
            <img src="logo.webp" alt="로고" style="width:80%; max-width:500px;">
            <br>
            <button class="start-btn" id="startBtn">START!</button>
        </div>
    </div>

    <nav id="nav-bar">
        <div class="nav-link" onclick="showView('view-home')">HOME</div>
        <div class="nav-link" onclick="showView('view-char')">캐릭터</div>
        <div class="nav-link" onclick="showView('view-outfit')">의상</div>
        <div class="nav-link" onclick="showView('view-cmd')">명령어</div>
    </nav>

    <audio id="bgm" loop><source src="cute_bgm.mp3" type="audio/mpeg"></audio>

    <main id="main-wrapper">
        <div id="view-home" class="view active">
            <div style="text-align:center;">
                <img src="logo.webp" alt="로고" style="width:90%; max-width:600px; margin-bottom:20px;">
                <div style="background:var(--white); padding:20px; border-radius:20px; border:4px solid var(--main-pink); cursor:pointer;" onclick="showView('view-char')"><h2>캐릭터 목록 보기</h2></div>
            </div>
        </div>

        <div id="view-char" class="view">
            <div id="char-category-view" class="content-box" style="text-align:center;">
                <h2 style="color: var(--main-pink); margin-bottom: 20px;">카테고리 선택</h2>
                <div style="background: var(--main-pink); padding:20px; border-radius:20px; color:white; font-size:1.5rem; cursor:pointer; margin-bottom:10px;" onclick="openCharDetail('main')">MAIN IDOLS</div>
                <div style="background: var(--main-blue); padding:20px; border-radius:20px; color:white; font-size:1.5rem; cursor:pointer;" onclick="openCharDetail('sub')">SUB CHARACTERS</div>
                <button class="back-btn" onclick="showView('view-home')">메인으로</button>
            </div>

            <div id="char-detail-main" class="char-detail-view content-box" style="display:none; text-align:center;">
                <h2 style="color: var(--main-pink); margin-bottom:15px;">🌟 MAIN</h2>
                <div class="profile-list">
                    <div class="profile-card"><div class="profile-img-box"><img src="c11.webp"></div><div class="profile-info"><h3>임유리 (21)</h3><p>ISTJ / 168cm</p></div></div>
                    <div class="profile-card"><div class="profile-img-box"><img src="c21.webp"></div><div class="profile-info"><h3>강시유 (20)</h3><p>ENFP / 162cm</p></div></div>
                    <div class="profile-card"><div class="profile-img-box"><img src="c31.webp"></div><div class="profile-info"><h3>강예은 (21)</h3><p>INFP / 164cm</p></div></div>
                    <div class="profile-card"><div class="profile-img-box"><img src="c41.webp"></div><div class="profile-info"><h3>정보라 (20)</h3><p>ESTP / 162cm</p></div></div>
                    <div class="profile-card"><div class="profile-img-box"><img src="c51.webp"></div><div class="profile-info"><h3>이수아 (21)</h3><p>INTP / 170cm</p></div></div>
                </div>
                <button class="back-btn" onclick="closeCharDetail()">뒤로가기</button>
            </div>

            <div id="char-detail-sub" class="char-detail-view content-box" style="display:none; border-color: var(--main-blue); text-align:center;">
                <h2 style="color: var(--main-blue); margin-bottom:15px;">✨ SUB</h2>
                <div class="profile-list" id="sub-char-list"></div>
                <button class="back-btn" onclick="closeCharDetail()" style="background:var(--main-blue)">뒤로가기</button>
            </div>
        </div>

        <div id="view-outfit" class="view"><div class="content-box" style="text-align:center;"><h2>👗 준비 중</h2><button class="back-btn" onclick="showView('view-home')">메인으로</button></div></div>
        <div id="view-cmd" class="view"><div class="content-box" style="text-align:center;"><h2>⌨️ 준비 중</h2><button class="back-btn" onclick="showView('view-home')">메인으로</button></div></div>
    </main>

    <script>
        const mainWrapper = document.getElementById('main-wrapper');
        const navBar = document.getElementById('nav-bar');

        document.getElementById('startBtn').addEventListener('click', function() {
            document.getElementById('overlay').classList.add('fade-out');
            mainWrapper.style.display = 'flex';
            document.getElementById('bgm').play().catch(()=>{});
        });

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId === 'view-home') navBar.classList.remove('active-nav');
            else navBar.classList.add('active-nav');
        }

        function openCharDetail(type) {
            document.getElementById('char-category-view').style.display = 'none';
            document.getElementById('char-detail-' + type).style.display = 'block';
        }

        function closeCharDetail() {
            document.querySelectorAll('.char-detail-view').forEach(v => v.style.display = 'none');
            document.getElementById('char-category-view').style.display = 'block';
        }

        // SUB 캐릭터: 이름과 정보만 노출 (라벨 제거)
        const subChars = [
            {n:"펠리아", d:"비서 (30세)", i:"001.webp"}, {n:"남기욱", d:"재벌 (32세)", i:"002.webp"}, {n:"박승철", d:"촬영 감독 (39세)", i:"003.webp"}, {n:"양정식", d:"CEO (50세)", i:"004.webp"},
            {n:"방울개", d:"작곡가", i:"005.webp"}, {n:"루이 김", d:"디자이너 (36세)", i:"006.webp"}, {n:"엘리아", d:"EXIA (21세)", i:"007.webp"}, {n:"티라", d:"EXIA (21세)", i:"008.webp"},
            {n:"파란", d:"EXIA (20세)", i:"009.webp"}, {n:"가을", d:"EXIA (20세)", i:"010.webp"}, {n:"헤라", d:"EXIA (21세)", i:"011.webp"}, {n:"시우", d:"VIA:VOID (21세)", i:"012.webp"},
            {n:"베니", d:"VIA:VOID (22세)", i:"013.webp"}, {n:"로먼", d:"VIA:VOID (20세)", i:"014.webp"}, {n:"주안", d:"VIA:VOID (20세)", i:"015.webp"}, {n:"아키", d:"VIA:VOID (22세)", i:"016.webp"},
            {n:"여자팬", d:"엑스트라", i:"017.webp"}, {n:"남자팬", d:"엑스트라", i:"018.webp"}, {n:"사생팬", d:"엑스트라", i:"019.webp"}, {n:"열성팬", d:"엑스트라", i:"020.webp"}
        ];

        const subList = document.getElementById('sub-char-list');
        subChars.forEach(c => {
            subList.innerHTML += `
                <div class="profile-card sub-card">
                    <div class="profile-img-box"><img src="${c.i}"></div>
                    <div class="profile-info">
                        <h3>${c.n}</h3>
                        <p class="sub-text">${c.d}</p>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
