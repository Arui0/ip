<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이돌 플래너 - 나만의 아이돌을 빛나게 하세요!</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #FFD1DC;
            --main-blue: #AEC6CF;
            --main-purple: #DCD0FF;
            --soft-yellow: #FFF9C4;
            --text-color: #5D5D5D;
            --white: #ffffff;
            /* 배경용 반투명 파스텔 컬러 */
            --bg-pink: rgba(255, 209, 220, 0.5);
            --bg-blue: rgba(174, 198, 207, 0.5);
            --bg-purple: rgba(220, 208, 255, 0.5);
            --bg-yellow: rgba(255, 249, 196, 0.5);
        }

        /* --- 기본 스타일 (배경색 변경) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jua', sans-serif; }
        body { background-color: var(--white); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* --- [신규] 배경 애니메이션 스타일 --- */
        .animated-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 콘텐츠 뒤로 배치 */
            overflow: hidden;
            pointer-events: none;
        }
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(5px); /* 몽환적인 느낌 */
        }
        /* 동그라미 움직임 정의 */
        @keyframes move1 { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(100px, -150px) rotate(180deg); } 100% { transform: translate(0, 0) rotate(360deg); } }
        @keyframes move2 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-80px, 120px) scale(1.2); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes move3 { 0% { transform: translate(0, 0); opacity: 0.4;} 50% { transform: translate(150px, 80px); opacity: 0.7;} 100% { transform: translate(0, 0); opacity: 0.4;} }

        /* 개별 동그라미 설정 (위치, 크기, 색상, 애니메이션 속도) */
        .bc1 { width: 200px; height: 200px; background: var(--bg-pink); top: 10%; left: 10%; animation: move1 25s infinite linear; }
        .bc2 { width: 300px; height: 300px; background: var(--bg-blue); top: 60%; left: 80%; animation: move2 30s infinite ease-in-out; }
        .bc3 { width: 150px; height: 150px; background: var(--bg-purple); top: 40%; left: 40%; animation: move3 20s infinite alternate; }
        .bc4 { width: 250px; height: 250px; background: var(--bg-yellow); top: 80%; left: 20%; animation: move1 28s infinite linear reverse; }
        .bc5 { width: 180px; height: 180px; background: var(--bg-pink); top: -50px; left: 60%; animation: move2 35s infinite ease-in-out -5s; }
        .bc6 { width: 350px; height: 350px; background: var(--bg-blue); top: 30%; left: -100px; animation: move3 22s infinite alternate -10s; }


        /* --- 기존 애니메이션 설정 --- */
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(0) rotate(15deg); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 0.8; background: rgba(255, 255, 255, 0.9); } 100% { opacity: 0; } }

        /* --- 진입 오버레이 --- */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: background 0.6s ease-in-out; }
        #overlay.fade-out { background: transparent; pointer-events: none; opacity: 0; }
        .overlay-content { text-align: center; transform-origin: center center; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pop-out { animation: popOut 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }
        .start-btn { padding: 22px 50px; font-size: 2.3rem; background: var(--white); color: var(--main-blue); border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #89a3ad; transition: all 0.2s ease; margin-top: 30px; }
        .start-logo-img { width: 85%; max-width: 650px; height: auto; margin-bottom: 20px; }

        /* --- 내비게이션 바 --- */
        nav { position: fixed; top: -100px; left: 0; width: 100%; height: 70px; background: rgba(255, 255, 255, 0.85); display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 1000; border-bottom: 4px solid var(--main-blue); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; }
        nav.active-nav { top: 0; opacity: 1; pointer-events: auto; }
        .nav-link { padding: 8px 18px; border-radius: 20px; cursor: pointer; color: var(--main-blue); font-size: 1.2rem; transition: all 0.2s; }
        .nav-link.active { background: var(--main-blue); color: white; }

        /* --- 메인 레이아웃 --- */
        #main-wrapper { width: 100%; max-width: 1000px; padding-top: 50px; display: none; flex-direction: column; align-items: center; }
        #main-wrapper.nav-padding { padding-top: 100px; }
        .view { display: none; width: 100%; animation: popIn 0.6s forwards; padding: 20px; }
        .view.active { display: flex; flex-direction: column; align-items: center; }

        /* --- 메뉴 버튼 --- */
        .home-logo { text-align: center; margin-bottom: 50px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .main-logo-img { width: 95%; max-width: 750px; height: auto; margin-bottom: 20px; animation: bounce 2s infinite; }
        .menu-grid { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; margin-bottom: 80px; width: 100%; }
        .menu-img-btn { position: relative; width: 260px; cursor: pointer; border-radius: 30px; overflow: hidden; transition: transform 0.3s; }
        .menu-img-btn img { width: 100%; height: auto; display: block; }
        .menu-img-btn:active::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; opacity: 0; pointer-events: none; animation: flashEffect 0.4s ease-out; }

        /* --- 캐릭터 탭 구조 (여백 제거 및 병렬 배치) --- */
        .char-section { display: none; width: 100%; flex-direction: column; align-items: center; }
        .char-section.active { display: flex; }

        .profile-list { display: flex; flex-direction: column; gap: 40px; width: 100%; align-items: center; margin-top: 30px; }
        .profile-card { width: 100%; max-width: 550px; background: white; border-radius: 50px; border: 8px solid var(--main-pink); overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.08); text-align: left; }
        
        /* 이미지 여백 제거 */
        .profile-img-box { width: 100%; height: auto; background: #fffcfd; position: relative; border-bottom: 8px solid var(--main-pink); }
        .profile-img-box img { width: 100%; height: auto; display: block; object-fit: contain; }

        .profile-info { padding: 30px; }
        .profile-info h3 { font-size: 2.3rem; color: #ff8fa3; margin-bottom: 10px; border-bottom: 2px solid #ffedf0; display: inline-block; }
        
        /* [핵심] 캐릭터 정보 병렬 텍스트 배치 */
        .char-stats-text { 
            font-size: 1.2rem; 
            color: #888; 
            margin-top: 5px; 
            word-break: keep-all; 
            line-height: 1.4;
        }
        
        .swap-btn { width: 100%; margin-top: 20px; padding: 15px; background: var(--main-pink); color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 1.3rem; transition: 0.2s; box-shadow: 0 5px 0 #ebb5c1; }

        /* --- 모바일 최적화 --- */
        @media (max-width: 480px) {
            .profile-info { padding: 20px; }
            .profile-info h3 { font-size: 1.7rem; }
            .char-stats-text { font-size: 1rem; color: #777; }
            .category-btn { font-size: 2.2rem !important; padding: 35px !important; }
            .profile-card { border-radius: 35px; border-width: 6px; }
        }

        /* --- 콘텐츠 박스 --- */
        .content-box { width: 100%; max-width: 850px; background: var(--white); padding: 50px; border-radius: 40px; border: 8px solid var(--main-pink); margin-bottom: 50px; text-align: center; }
        .category-btn { width: 100%; padding: 50px; border-radius: 35px; font-size: 3rem; cursor: pointer; color: white; border: none; transition: transform 0.3s; margin-bottom: 25px; }
        .category-btn:hover { transform: scale(1.03); }
        .back-btn { margin-top: 30px; padding: 12px 40px; background: #ccc; color: white; border: none; border-radius: 35px; cursor: pointer; font-size: 1.3rem; }

        .volume-container { position: fixed; bottom: 25px; right: 25px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); padding: 12px 25px; border-radius: 40px; display: flex; align-items: center; gap: 15px; z-index: 100; border: 3px solid var(--main-pink); opacity: 0; transition: 1s; }
        body.loaded .volume-container { opacity: 1; }
    </style>
</head>
<body>

    <div class="animated-background">
        <div class="bg-circle bc1"></div>
        <div class="bg-circle bc2"></div>
        <div class="bg-circle bc3"></div>
        <div class="bg-circle bc4"></div>
        <div class="bg-circle bc5"></div>
        <div class="bg-circle bc6"></div>
    </div>

    <div id="overlay">
        <div class="overlay-content" id="overlayText">
            <img src="logo.webp" class="start-logo-img">
            <button class="start-btn" id="startBtn">START!</button>
        </div>
    </div>

    <nav id="nav-bar">
        <div class="nav-link" onclick="showView('view-home')">HOME</div>
        <div class="nav-link" onclick="showView('view-char')">캐릭터 목록</div>
        <div class="nav-link" onclick="showView('view-outfit')">의상 목록</div>
        <div class="nav-link" onclick="showView('view-cmd')">명령어 목록</div>
    </nav>

    <audio id="bgm" loop><source src="cute_bgm.mp3" type="audio/mpeg"></audio>
    <audio id="startSfx"><source src="inside.mp3" type="audio/mpeg"></audio>
    <audio id="clickSfx"><source src="click.mp3" type="audio/mpeg"></audio>

    <div class="volume-container">
        <span id="muteBtn" style="cursor:pointer">🎵</span>
        <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="0.6">
    </div>

    <main id="main-wrapper">
        <div id="view-home" class="view active">
            <div class="home-logo">
                <img src="logo.webp" class="main-logo-img">
                <div style="font-size: 1.1rem; color: white; background: rgba(0,0,0,0.1); padding: 5px 20px; border-radius: 20px;">제작자: 아루이 / 플랫폼: 크랙</div>
            </div>
            <div class="menu-grid">
                <div class="menu-img-btn" onclick="showView('view-char')"><img src="a.png"></div>
                <div class="menu-img-btn" onclick="showView('view-outfit')"><img src="c.png"></div>
                <div class="menu-img-btn" onclick="showView('view-cmd')"><img src="b.png"></div>
            </div>
        </div>

        <div id="view-char" class="view">
            <div id="char-step-category" class="char-section active">
                <div class="content-box">
                    <h2 style="color: var(--main-pink); margin-bottom: 40px; font-size: 2.8rem;">CATEGORY</h2>
                    <button class="category-btn" style="background: var(--main-pink);" onclick="openCharStep('main')">MAIN</button>
                    <button class="category-btn" style="background: var(--main-blue);" onclick="openCharStep('sub')">SUB</button>
                    <button class="back-btn" onclick="showView('view-home')">홈으로</button>
                </div>
            </div>

            <div id="char-step-main" class="char-section">
                <div class="content-box">
                    <h2 style="color: var(--main-pink); font-size: 3rem; margin-bottom: 20px;">MAIN</h2>
                    <div class="profile-list" id="main-list-container"></div>
                    <button class="back-btn" onclick="closeCharStep()" style="background:var(--main-pink)">카테고리로</button>
                </div>
            </div>

            <div id="char-step-sub" class="char-section">
                <div class="content-box" style="border-color: var(--main-blue);">
                    <h2 style="color: var(--main-blue); font-size: 3rem; margin-bottom: 20px;">SUB</h2>
                    <div class="profile-list" id="sub-list-container"></div>
                    <button class="back-btn" onclick="closeCharStep()" style="background:var(--main-blue)">카테고리로</button>
                </div>
            </div>
        </div>

        <div id="view-outfit" class="view"><div class="content-box"><h2>👗 의상 목록</h2><div id="outfit-data" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;"></div><button class="back-btn" onclick="showView('view-home')">홈으로</button></div></div>
        <div id="view-cmd" class="view"><div class="content-box"><h2>⌨️ 명령어 목록</h2><div id="cmd-data" style="text-align:left; margin-top:20px;"></div><button class="back-btn" onclick="showView('view-home')">홈으로</button></div></div>

        <footer style="color:white; padding: 60px 0;">&copy; 2026 Idol Planner Project.</footer>
    </main>

    <script>
        const bgm = document.getElementById('bgm');
        const startSfx = document.getElementById('startSfx');
        const clickSfx = document.getElementById('clickSfx');
        const mainWrapper = document.getElementById('main-wrapper');

        function playClick() { clickSfx.currentTime = 0; clickSfx.play().catch(e=>{}); }
        function swap(id, o, a) { playClick(); const img = document.getElementById(id); img.src = img.src.includes(o) ? a : o; }

        document.getElementById('startBtn').addEventListener('click', () => {
            playClick(); startSfx.play(); bgm.play();
            document.getElementById('overlayText').classList.add('pop-out');
            setTimeout(() => {
                const overlay = document.getElementById('overlay');
                overlay.classList.add('fade-out');
                mainWrapper.style.display = 'flex';
                document.body.classList.add('loaded');
                setTimeout(() => { overlay.style.display = 'none'; }, 700);
            }, 800);
        });

        function showView(viewId) {
            playClick();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            if(viewId === 'view-char') closeCharStep();
            if(viewId === 'view-home') { document.getElementById('nav-bar').classList.remove('active-nav'); mainWrapper.classList.remove('nav-padding'); }
            else { document.getElementById('nav-bar').classList.add('active-nav'); mainWrapper.classList.add('nav-padding'); }
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        function openCharStep(step) {
            playClick();
            document.querySelectorAll('.char-section').forEach(s => s.classList.remove('active'));
            document.getElementById('char-step-' + step).classList.add('active');
            window.scrollTo(0,0);
        }

        function closeCharStep() {
            document.querySelectorAll('.char-section').forEach(s => s.classList.remove('active'));
            document.getElementById('char-step-category').classList.add('active');
        }

        // [메인 캐릭터 데이터 - 정보 병렬화 유지]
        const mainIdols = [
            {id:"m1", n:"임유리", a:21, info:"ISTJ · 168cm · C컵", i1:"c11.webp", i2:"c12.webp"},
            {id:"m2", n:"강시유", a:20, info:"ENFP · 162cm · E컵", i1:"c21.webp", i2:"c22.webp"},
            {id:"m3", n:"강예은", a:21, info:"INFP · 164cm · B컵", i1:"c31.webp", i2:"c32.webp"},
            {id:"m4", n:"정보라", a:20, info:"ESTP · 162cm · A컵", i1:"c41.webp", i2:"c42.webp"},
            {id:"m5", n:"이수아", a:21, info:"INTP · 170cm · F컵", i1:"c51.webp", i2:"c52.webp"}
        ];
        
        const mainList = document.getElementById('main-list-container');
        mainIdols.forEach(m => {
            mainList.innerHTML += `
                <div class="profile-card">
                    <div class="profile-img-box"><img id="${m.id}" src="${m.i1}"></div>
                    <div class="profile-info">
                        <h3>${m.n} (${m.a})</h3>
                        <div class="char-stats-text">${m.info}</div>
                        <button class="swap-btn" onclick="swap('${m.id}','${m.i1}','${m.i2}')">의상 체인지! ✨</button>
                    </div>
                </div>`;
        });

        // [서브 캐릭터 데이터 - 정보 병렬화 유지]
        const subs = [
            {n:"펠리아", a:30, info:"비서 / 여자", i:"001.webp"}, {n:"남기욱", a:32, info:"재벌 / 남자", i:"002.webp"}, {n:"박승철", a:39, info:"촬영 감독 / 남자", i:"003.webp"},
            {n:"양정식", a:50, info:"루이브 기획사 CEO / 남자", i:"004.webp"}, {n:"방울개", a:"?", info:"작곡가 / 남자", i:"005.webp"}, {n:"루이 김", a:36, info:"디자이너 / 남자", i:"006.webp"},
            {n:"엘리아", a:21, info:"EXIA 멤버 / 여자", i:"007.webp"}, {n:"티라", a:21, info:"EXIA 멤버 / 여자", i:"008.webp"}, {n:"파란", a:20, info:"EXIA 멤버 / 여자", i:"009.webp"},
            {n:"가을", a:20, info:"EXIA 멤버 / 여자", i:"010.webp"}, {n:"헤라", a:21, info:"EXIA 멤버 / 여자", i:"011.webp"}, {n:"시우", a:21, info:"VIA:VOID 멤버 / 남자", i:"012.webp"},
            {n:"베니", a:22, info:"VIA:VOID 멤버 / 남자", i:"013.webp"}, {n:"로먼", a:20, info:"VIA:VOID 멤버 / 남자", i:"014.webp"}, {n:"주안", a:20, info:"VIA:VOID 멤버 / 남자", i:"015.webp"},
            {n:"아키", a:22, info:"VIA:VOID 멤버 / 남자", i:"016.webp"}, {n:"여자팬", a:"", info:"엑스트라", i:"017.webp"}, {n:"남자팬", a:"", info:"엑스트라", i:"018.webp"},
            {n:"사생팬", a:"", info:"엑스트라", i:"019.webp"}, {n:"열성팬", a:"", info:"엑스트라", i:"020.webp"}
        ];
        const subList = document.getElementById('sub-list-container');
        subs.forEach(s => {
            const ageStr = s.a ? `(${s.a})` : '';
            subList.innerHTML += `<div class="profile-card" style="border-color:var(--main-blue)"><div class="profile-img-box"><img src="${s.i}"></div><div class="profile-info"><h3 style="color:#6a89cc">${s.n} ${ageStr}</h3><div class="char-stats-text" style="color:#6a89cc">${s.info}</div></div></div>`;
        });

        // [원본 데이터 복구 유지]
        const o_data = ["연습복:a", "트레이닝복:b", "사복:c", "속옷:d", "나체:e", "속박:f", "파자마:g", "무대의상1:h", "무대의상2:i", "무대의상3:j", "무대의상4:k", "간호사복:l", "경찰복:m", "드레스:n", "바니걸:o", "비키니:p", "산타복:q", "수트:r", "올블랙정장:s", "웨딩드레스:t", "한복:u", "메이드복:v"];
        o_data.forEach(x => { const [n,c]=x.split(':'); document.getElementById('outfit-data').innerHTML += `<div style="background:#fdfdfd; padding:10px; border-radius:15px; border-left:5px solid var(--main-pink); display:flex; justify-content:space-between"><span>${n}</span><b>${c}</b></div>`; });
        
        const c_data = ["!팬사이트:팬 사이트 열람", "!커뮤:커뮤니티 열람", "!위키:위키 열람", "!기사:기사 열람", "!SNS:SNS 열람", "!피팅:의상 확인", "!이미지:이미지 디버그", "!사칭방지:사칭 디버그", "!요약:현재까지 상황 요약"];
        c_data.forEach(x => { const [n,d]=x.split(':'); document.getElementById('cmd-data').innerHTML += `<div style="margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;"><b>${n}</b> : <span style="color:#888">${d}</span></div>`; });

        document.getElementById('volumeRange').addEventListener('input', (e) => bgm.volume = e.target.value);
    </script>
</body>
</html>
