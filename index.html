<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이돌 플래너 - 나만의 아이돌을 빛나게 하세요!</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #FFD1DC;
            --main-blue: #AEC6CF;
            --main-purple: #DCD0FF;
            --soft-yellow: #FFF9C4;
            --text-color: #5D5D5D;
            --white: #ffffff;
        }

        /* --- 기본 스타일 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jua', sans-serif; }
        body { background-color: var(--main-pink); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* --- 애니메이션 --- */
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(0) rotate(15deg); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }
        @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 0.8; background: rgba(255, 255, 255, 0.9); } 100% { opacity: 0; } }

        /* --- 진입 오버레이 --- */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: background 0.6s ease-in-out; }
        #overlay.fade-out { background: transparent; pointer-events: none; }
        .overlay-content { text-align: center; transform-origin: center center; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pop-out { animation: popOut 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }
        .start-btn { padding: 22px 50px; font-size: 2.3rem; background: var(--white); color: var(--main-blue); border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #89a3ad; transition: all 0.2s ease; margin-top: 30px; -webkit-tap-highlight-color: transparent; }
        .start-logo-img { width: 80%; max-width: 500px; height: auto; margin-bottom: 20px; }

        /* --- 내비게이션 바 --- */
        nav { position: fixed; top: -100px; left: 0; width: 100%; height: 70px; background: rgba(255, 255, 255, 0.85); display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 1000; border-bottom: 4px solid var(--main-blue); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; }
        nav.active-nav { top: 0; opacity: 1; pointer-events: auto; }
        .nav-link { padding: 8px 18px; border-radius: 20px; cursor: pointer; color: var(--main-blue); font-size: 1.2rem; transition: all 0.2s; }
        .nav-link.active { background: var(--main-blue); color: white; }

        /* --- 메인 영역 --- */
        #main-wrapper { width: 100%; max-width: 1000px; padding-top: 50px; display: none; flex-direction: column; align-items: center; transition: padding-top 0.5s ease; }
        #main-wrapper.nav-padding { padding-top: 100px; }
        .view { display: none; width: 100%; animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; padding: 20px; }
        .view.active { display: flex; flex-direction: column; align-items: center; }

        /* --- 홈 화면 스타일 --- */
        .home-logo { text-align: center; margin-bottom: 50px; display: flex; flex-direction: column; align-items: center; }
        .main-logo-img { width: 90%; max-width: 600px; height: auto; margin-bottom: 20px; animation: bounce 2s infinite; }
        .info-tag { font-size: 1.2rem; color: white; background: rgba(0,0,0,0.1); padding: 5px 20px; border-radius: 20px; display: inline-block; margin-top: 15px; }
        .menu-grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; margin-bottom: 80px; width: 100%; }
        .menu-img-btn { position: relative; width: 280px; cursor: pointer; border-radius: 30px; overflow: hidden; transition: transform 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .menu-img-btn img { width: 100%; height: auto; display: block; }
        .menu-img-btn:hover { transform: scale(1.05); }
        .menu-img-btn::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; opacity: 0; pointer-events: none; }
        .menu-img-btn:active::after, .menu-img-btn:hover::after { animation: flashEffect 0.4s ease-out; }

        /* --- 캐릭터 목록 배너 --- */
        .char-category-grid { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-top: 20px; }
        .char-banner { position: relative; width: 100%; height: 150px; border-radius: 30px; display: flex; justify-content: center; align-items: center; font-size: 3rem; color: white; text-shadow: 3px 3px 0 rgba(0,0,0,0.1); cursor: pointer; overflow: hidden; transition: all 0.3s ease; border: 6px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .main-banner { background: var(--main-pink); }
        .sub-banner { background: var(--main-blue); }
        .char-banner:hover { transform: translateY(-5px) scale(1.02); }
        .char-banner::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; opacity: 0; pointer-events: none; }
        .char-banner:active::after { animation: flashEffect 0.4s ease-out; }
        .char-detail-view { display: none; width: 100%; flex-direction: column; align-items: center; animation: popIn 0.5s forwards; }
        .char-detail-view.active { display: flex; }

        /* --- 콘텐츠 박스 공통 --- */
        .content-box { width: 100%; max-width: 850px; background: var(--white); padding: 50px; border-radius: 40px; border: 8px solid var(--main-pink); margin-bottom: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .list-group h3 { background: var(--main-blue); color: white; display: inline-block; padding: 6px 18px; border-radius: 12px; margin-bottom: 20px; font-size: 1.4rem; margin-top: 10px; }
        .outfit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; width: 100%; }
        .list-item { background: #fdfdfd; padding: 12px 18px; border-radius: 20px; border-left: 8px solid var(--main-pink); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; }

        /* --- [반투명] 볼륨 컨트롤 탭 --- */
        .volume-container { 
            position: fixed; bottom: 25px; right: 25px; 
            background: rgba(255, 255, 255, 0.6); /* 반투명 설정 */
            backdrop-filter: blur(8px); /* 뒤쪽 살짝 흐리게 */
            padding: 12px 25px; border-radius: 40px; display: flex; align-items: center; gap: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); z-index: 100; border: 3px solid var(--main-pink); 
            opacity: 0; transition: all 1s; 
        }
        body.loaded .volume-container { opacity: 1; }
        #muteBtn { cursor: pointer; font-size: 1.4rem; transition: transform 0.2s; user-select: none; }
        #muteBtn:active { transform: scale(0.8); }

        .bg-circle { position: fixed; z-index: -1; border-radius: 50%; background: var(--white); opacity: 0.4; animation: float 8s infinite ease-in-out; }
        .back-btn { margin-top: 30px; padding: 12px 40px; background: var(--main-pink); color: white; border: none; border-radius: 35px; cursor: pointer; font-size: 1.3rem; transition: transform 0.2s; }

        /* --- 반응형 최적화 --- */
        @media (max-width: 768px) { .menu-img-btn { width: 100%; max-width: 350px; } .main-logo-img { max-width: 400px; } .char-banner { height: 120px; font-size: 2.2rem; } }
        @media (max-width: 480px) { .home-logo p { font-size: 1.2rem; } .start-btn { font-size: 1.8rem; padding: 15px 40px; } .content-box { padding: 30px 15px; } .outfit-grid { grid-template-columns: 1fr; } .main-logo-img { max-width: 280px; } .char-banner { height: 100px; font-size: 2rem; } }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="overlay-content" id="overlayText">
            <img src="logo.png" alt="아이돌 플래너 로고" class="start-logo-img">
            <button class="start-btn" id="startBtn">START!</button>
        </div>
    </div>

    <nav id="nav-bar">
        <div class="nav-link" onclick="showView('view-home')">HOME</div>
        <div class="nav-link" onclick="showView('view-char')">캐릭터 목록</div>
        <div class="nav-link" onclick="showView('view-outfit')">의상 목록</div>
        <div class="nav-link" onclick="showView('view-cmd')">명령어 목록</div>
    </nav>

    <audio id="bgm" loop preload="auto"><source src="cute_bgm.mp3" type="audio/mpeg"></audio>
    <audio id="startSfx" preload="auto"><source src="inside.mp3" type="audio/mpeg"></audio>
    <audio id="clickSfx" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>

    <div class="volume-container">
        <span id="muteBtn">🎵</span>
        <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="0.6">
    </div>

    <div class="bg-circle" style="width: 300px; height: 300px; top: -50px; left: -50px;"></div>
    <div class="bg-circle" style="width: 200px; height: 200px; bottom: -50px; right: -50px; background: var(--main-purple);"></div>

    <main id="main-wrapper">
        <div id="view-home" class="view active">
            <div class="home-logo">
                <img src="logo.png" alt="아이돌 플래너 로고" class="main-logo-img">
                <p style="font-size: 1.8rem; color: white;">🌸 대표님, 환영합니다! 🌸</p>
                <div class="info-tag">제작자: 아루이 / 플랫폼: 크랙</div>
            </div>
            <div class="menu-grid">
                <div class="menu-img-btn" onclick="showView('view-char')"><img src="a.png" alt="캐릭터 목록"></div>
                <div class="menu-img-btn" onclick="showView('view-outfit')"><img src="c.png" alt="의상 목록"></div>
                <div class="menu-img-btn" onclick="showView('view-cmd')"><img src="b.png" alt="명령어 목록"></div>
            </div>
        </div>

        <div id="view-char" class="view">
            <div id="char-category-view" class="content-box">
                <h2 style="color: var(--main-pink); margin-bottom: 30px; font-size: 2.8rem;">💖 캐릭터 목록</h2>
                <div class="char-category-grid">
                    <div class="char-banner main-banner" onclick="openCharDetail('main')">MAIN</div>
                    <div class="char-banner sub-banner" onclick="openCharDetail('sub')">SUB</div>
                </div>
                <button class="back-btn" onclick="showView('view-home')">홈으로 돌아가기</button>
            </div>
            <div id="char-detail-main" class="char-detail-view content-box">
                <h2 style="color: var(--main-pink); margin-bottom: 30px; font-size: 2.5rem;">🌟 MAIN 캐릭터</h2>
                <p style="font-size: 1.4rem; color: #888;">*여기에 MAIN 캐릭터 특징 작성 예정*</p>
                <button class="back-btn" onclick="closeCharDetail()">뒤로 가기</button>
            </div>
            <div id="char-detail-sub" class="char-detail-view content-box" style="border-color: var(--main-blue);">
                <h2 style="color: var(--main-blue); margin-bottom: 30px; font-size: 2.5rem;">✨ SUB 캐릭터</h2>
                <p style="font-size: 1.4rem; color: #888;">*여기에 SUB 캐릭터 특징 작성 예정*</p>
                <button class="back-btn" onclick="closeCharDetail()" style="background-color: var(--main-blue);">뒤로 가기</button>
            </div>
        </div>

        <div id="view-outfit" class="view"><div class="content-box"><button class="back-btn" onclick="showView('view-home')">홈으로 돌아가기</button></div></div>
        <div id="view-cmd" class="view"><div class="content-box"><button class="back-btn" onclick="showView('view-home')">홈으로 돌아가기</button></div></div>
        
        <footer style="color:white; padding: 60px 0;">&copy; 2026 Idol Planner Project. All Rights Reserved.</footer>
    </main>

    <script>
        const bgm = document.getElementById('bgm');
        const startSfx = document.getElementById('startSfx');
        const clickSfx = document.getElementById('clickSfx');
        const volumeRange = document.getElementById('volumeRange');
        const muteBtn = document.getElementById('muteBtn');
        const navBar = document.getElementById('nav-bar');
        const mainWrapper = document.getElementById('main-wrapper');
        const startBtn = document.getElementById('startBtn');

        let isMuted = false;
        bgm.volume = 0.6;
        startSfx.volume = 1.0;
        clickSfx.volume = 0.8;

        // [공통] 클릭 효과음 재생 함수
        function playClick() {
            clickSfx.currentTime = 0;
            clickSfx.play().catch(e => {});
        }

        // [기능] 시작 버튼
        startBtn.addEventListener('click', function() {
            playClick(); // 클릭음
            startSfx.play().catch(e => {});
            bgm.play().catch(e => {});
            document.getElementById('overlayText').classList.add('pop-out');
            setTimeout(() => {
                document.getElementById('overlay').classList.add('fade-out');
                mainWrapper.style.display = 'flex';
                document.body.classList.add('loaded');
                setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 700);
            }, 800);
        });

        // [기능] 볼륨 조절 및 음소거
        volumeRange.addEventListener('input', (e) => { 
            bgm.volume = e.target.value;
            if (e.target.value == 0) {
                muteBtn.innerText = '🔇';
            } else if (!isMuted) {
                muteBtn.innerText = '🎵';
            }
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            bgm.muted = isMuted;
            muteBtn.innerText = isMuted ? '🔇' : (volumeRange.value == 0 ? '🔇' : '🎵');
            playClick();
        });

        // [기능] 화면 전환 (클릭음 추가)
        function showView(viewId) {
            playClick();
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.getElementById('char-category-view').style.display = 'block';
            document.querySelectorAll('.char-detail-view').forEach(view => view.classList.remove('active'));

            if (viewId === 'view-home') {
                navBar.classList.remove('active-nav');
                mainWrapper.classList.remove('nav-padding');
            } else {
                navBar.classList.add('active-nav');
                mainWrapper.classList.add('nav-padding');
            }
            document.getElementById(viewId).classList.add('active');
            const activeLink = document.querySelector(`.nav-link[onclick*="${viewId}"]`);
            if(activeLink) activeLink.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openCharDetail(type) {
            playClick();
            document.getElementById('char-category-view').style.display = 'none';
            if (type === 'main') document.getElementById('char-detail-main').classList.add('active');
            else document.getElementById('char-detail-sub').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeCharDetail() {
            playClick();
            document.querySelectorAll('.char-detail-view').forEach(view => view.classList.remove('active'));
            document.getElementById('char-category-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 네비게이션 링크에 클릭음 일괄 적용
        document.querySelectorAll('.nav-link, .back-btn').forEach(el => {
            el.addEventListener('click', playClick);
        });
    </script>
</body>
</html>
