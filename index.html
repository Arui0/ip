<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이돌 플래너 - 나만의 아이돌을 빛나게 하세요!</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #FFD1DC;
            --main-blue: #AEC6CF;
            --main-purple: #DCD0FF;
            --soft-yellow: #FFF9C4;
            --text-color: #5D5D5D;
            --white: #ffffff;
        }

        /* --- 기본 스타일 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jua', sans-serif; }
        body { background-color: var(--main-pink); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* --- 애니메이션 설정 --- */
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(0) rotate(15deg); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes flashEffect { 0% { opacity: 0; } 50% { opacity: 0.8; background: rgba(255, 255, 255, 0.9); } 100% { opacity: 0; } }

        /* --- 진입 오버레이 --- */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: background 0.6s ease-in-out; }
        #overlay.fade-out { background: transparent; pointer-events: none; opacity: 0; }
        .overlay-content { text-align: center; transform-origin: center center; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pop-out { animation: popOut 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }
        .start-btn { padding: 22px 50px; font-size: 2.3rem; background: var(--white); color: var(--main-blue); border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #89a3ad; transition: all 0.2s ease; margin-top: 30px; }
        .start-logo-img { width: 85%; max-width: 650px; height: auto; margin-bottom: 20px; }

        /* --- 내비게이션 바 --- */
        nav { position: fixed; top: -100px; left: 0; width: 100%; height: 70px; background: rgba(255, 255, 255, 0.85); display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 1000; border-bottom: 4px solid var(--main-blue); transition: all 0.5s; backdrop-filter: blur(8px); opacity: 0; pointer-events: none; }
        nav.active-nav { top: 0; opacity: 1; pointer-events: auto; }
        .nav-link { padding: 8px 15px; border-radius: 20px; cursor: pointer; color: var(--main-blue); font-size: 1.1rem; transition: 0.2s; }
        .nav-link.active { background: var(--main-blue); color: white; }

        /* --- 메인 레이아웃 --- */
        #main-wrapper { width: 100%; max-width: 1000px; padding-top: 50px; display: none; flex-direction: column; align-items: center; }
        #main-wrapper.nav-padding { padding-top: 100px; }
        .view { display: none; width: 100%; animation: popIn 0.6s forwards; padding: 15px; }
        .view.active { display: flex; flex-direction: column; align-items: center; }

        /* --- 메뉴 버튼 --- */
        .home-logo { text-align: center; margin-bottom: 40px; width: 100%; }
        .main-logo-img { width: 90%; max-width: 600px; animation: bounce 2s infinite; }
        .menu-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 60px; width: 100%; }
        .menu-img-btn { position: relative; width: 220px; cursor: pointer; border-radius: 30px; overflow: hidden; transition: 0.3s; }
        .menu-img-btn img { width: 100%; height: auto; display: block; }
        .menu-img-btn:active::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; animation: flashEffect 0.4s ease-out; }

        /* --- 캐릭터 카드 최적화 (핵심 수정 부분) --- */
        .char-section { display: none; width: 100%; flex-direction: column; align-items: center; }
        .char-section.active { display: flex; }

        .profile-list { display: flex; flex-direction: column; gap: 30px; width: 100%; align-items: center; margin-top: 20px; }
        .profile-card { width: 100%; max-width: 500px; background: white; border-radius: 35px; border: 6px solid var(--main-pink); overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
        
        /* [수정] 고정 높이 제거 및 이미지에 맞춤 */
        .profile-img-box { 
            width: 100%; 
            height: auto; /* 고정 높이(400px) 제거 -> 내용물에 맞춤 */
            background: #fffcfd; 
            position: relative; 
            overflow: hidden; 
            border-bottom: 6px solid var(--main-pink);
            display: flex; justify-content: center; align-items: flex-start; /* 이미지를 상단에 붙임 */
        }
        /* [수정] 이미지 비율 유지 설정 */
        .profile-img-box img { 
            width: 100%; 
            height: auto; /* 비율 유지 */
            object-fit: contain; 
            display: block; /* 하단 미세 공백 제거 */
        }
        
        .profile-info { padding: 25px; text-align: center; }
        .profile-info h3 { font-size: 2.2rem; color: #ff8fa3; margin-bottom: 12px; display: block; }
        
        /* 정보 표시를 태그 형태로 변경하여 공간 절약 (이전 제안 유지) */
        .stats-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 5px; }
        .stat-item { background: #fff5f7; padding: 6px 15px; border-radius: 12px; font-size: 1rem; color: #ff8fa3; border: 1px solid #ffedf0; }
        
        .swap-btn { width: 100%; margin-top: 15px; padding: 12px; background: var(--main-pink); color: white; border: none; border-radius: 15px; cursor: pointer; font-size: 1.2rem; box-shadow: 0 4px 0 #ebb5c1; }

        /* --- 모바일 기기별 추가 보정 --- */
        @media (max-width: 480px) {
            .profile-card { border-radius: 25px; border-width: 5px; }
            /* .profile-img-box { height: 320px; }  <-- 이 고정 높이 설정을 삭제했습니다 */
            .profile-info { padding: 15px; }
            .profile-info h3 { font-size: 1.8rem; }
            .stat-item { font-size: 0.9rem; padding: 4px 10px; }
            .category-btn { padding: 30px; font-size: 2rem; }
            .menu-img-btn { width: 100%; max-width: 280px; }
        }

        /* --- 콘텐츠 박스 --- */
        .content-box { width: 100%; max-width: 850px; background: var(--white); padding: 30px; border-radius: 40px; border: 6px solid var(--main-pink); margin-bottom: 40px; text-align: center; }
        .category-btn { width: 100%; padding: 40px; border-radius: 30px; font-size: 2.5rem; cursor: pointer; color: white; border: none; transition: 0.2s; margin-bottom: 20px; }
        .category-btn:hover { transform: translateY(-3px); }
        .back-btn { margin-top: 20px; padding: 10px 30px; background: #ddd; color: white; border: none; border-radius: 30px; cursor: pointer; font-size: 1.1rem; }

        .volume-container { position: fixed; bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.8); padding: 10px 15px; border-radius: 30px; display: flex; align-items: center; gap: 10px; z-index: 100; border: 2px solid var(--main-pink); opacity: 0; transition: 0.5s; }
        body.loaded .volume-container { opacity: 1; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="overlay-content" id="overlayText">
            <img src="logo.webp" class="start-logo-img">
            <button class="start-btn" id="startBtn">START!</button>
        </div>
    </div>

    <nav id="nav-bar">
        <div class="nav-link" onclick="showView('view-home')">HOME</div>
        <div class="nav-link" onclick="showView('view-char')">캐릭터</div>
        <div class="nav-link" onclick="showView('view-outfit')">의상</div>
        <div class="nav-link" onclick="showView('view-cmd')">명령어</div>
    </nav>

    <audio id="bgm" loop><source src="cute_bgm.mp3" type="audio/mpeg"></audio>
    <audio id="startSfx"><source src="inside.mp3" type="audio/mpeg"></audio>
    <audio id="clickSfx"><source src="click.mp3" type="audio/mpeg"></audio>

    <div class="volume-container">
        <span id="muteBtn" style="cursor:pointer">🎵</span>
        <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="0.6">
    </div>

    <main id="main-wrapper">
        <div id="view-home" class="view active">
            <div class="home-logo">
                <img src="logo.webp" class="main-logo-img">
                <div style="font-size: 0.9rem; color: #888; margin-top: 10px;">제작자: 아루이 / 플랫폼: 크랙</div>
            </div>
            <div class="menu-grid">
                <div class="menu-img-btn" onclick="showView('view-char')"><img src="a.png"></div>
                <div class="menu-img-btn" onclick="showView('view-outfit')"><img src="c.png"></div>
                <div class="menu-img-btn" onclick="showView('view-cmd')"><img src="b.png"></div>
            </div>
        </div>

        <div id="view-char" class="view">
            <div id="char-step-category" class="char-section active">
                <div class="content-box">
                    <h2 style="color: var(--main-pink); margin-bottom: 30px; font-size: 2.2rem;">분류 선택</h2>
                    <button class="category-btn" style="background: var(--main-pink);" onclick="openCharStep('main')">MAIN</button>
                    <button class="category-btn" style="background: var(--main-blue);" onclick="openCharStep('sub')">SUB</button>
                    <button class="back-btn" onclick="showView('view-home')">홈으로</button>
                </div>
            </div>

            <div id="char-step-main" class="char-section">
                <div class="content-box">
                    <h2 style="color: var(--main-pink); font-size: 2.5rem; margin-bottom: 20px;">MAIN</h2>
                    <div class="profile-list" id="main-list-container"></div>
                    <button class="back-btn" onclick="closeCharStep()" style="background:var(--main-pink)">카테고리로</button>
                </div>
            </div>

            <div id="char-step-sub" class="char-section">
                <div class="content-box" style="border-color: var(--main-blue);">
                    <h2 style="color: var(--main-blue); font-size: 2.5rem; margin-bottom: 20px;">SUB</h2>
                    <div class="profile-list" id="sub-list-container"></div>
                    <button class="back-btn" onclick="closeCharStep()" style="background:var(--main-blue)">카테고리로</button>
                </div>
            </div>
        </div>

        <div id="view-outfit" class="view"><div class="content-box"><h2 style="margin-bottom:20px;">👗 의상 목록</h2><div id="outfit-data" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div><button class="back-btn" onclick="showView('view-home')">홈으로</button></div></div>
        <div id="view-cmd" class="view"><div class="content-box"><h2 style="margin-bottom:20px;">⌨️ 명령어 목록</h2><div id="cmd-data" style="text-align:left;"></div><button class="back-btn" onclick="showView('view-home')">홈으로</button></div></div>

        <footer style="color:white; padding: 40px 0; text-align:center; font-size:0.9rem;">&copy; 2026 Idol Planner Project.</footer>
    </main>

    <script>
        const bgm = document.getElementById('bgm');
        const startSfx = document.getElementById('startSfx');
        const clickSfx = document.getElementById('clickSfx');
        const mainWrapper = document.getElementById('main-wrapper');

        function playClick() { clickSfx.currentTime = 0; clickSfx.play().catch(e=>{}); }
        function swap(id, o, a) { playClick(); const img = document.getElementById(id); img.src = img.src.includes(o) ? a : o; }

        document.getElementById('startBtn').addEventListener('click', () => {
            playClick(); startSfx.play(); bgm.play();
            document.getElementById('overlayText').classList.add('pop-out');
            setTimeout(() => {
                const overlay = document.getElementById('overlay');
                overlay.classList.add('fade-out');
                mainWrapper.style.display = 'flex';
                document.body.classList.add('loaded');
                setTimeout(() => { overlay.style.display = 'none'; }, 700);
            }, 800);
        });

        function showView(viewId) {
            playClick();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            if(viewId === 'view-char') closeCharStep();
            if(viewId === 'view-home') { document.getElementById('nav-bar').classList.remove('active-nav'); mainWrapper.classList.remove('nav-padding'); }
            else { document.getElementById('nav-bar').classList.add('active-nav'); mainWrapper.classList.add('nav-padding'); }
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        function openCharStep(step) {
            playClick();
            document.querySelectorAll('.char-section').forEach(s => s.classList.remove('active'));
            document.getElementById('char-step-' + step).classList.add('active');
            window.scrollTo(0,0);
        }

        function closeCharStep() {
            document.querySelectorAll('.char-section').forEach(s => s.classList.remove('active'));
            document.getElementById('char-step-category').classList.add('active');
        }

        const mainIdols = [
            {id:"m1", n:"임유리", m:"ISTJ", h:"168cm", b:"C컵", a:21, i1:"c11.webp", i2:"c12.webp"},
            {id:"m2", n:"강시유", m:"ENFP", h:"162cm", b:"E컵", a:20, i1:"c21.webp", i2:"c22.webp"},
            {id:"m3", n:"강예은", m:"INFP", h:"164cm", b:"B컵", a:21, i1:"c31.webp", i2:"c32.webp"},
            {id:"m4", n:"정보라", m:"ESTP", h:"162cm", b:"A컵", a:20, i1:"c41.webp", i2:"c42.webp"},
            {id:"m5", n:"이수아", m:"INTP", h:"170cm", b:"F컵", a:20, i1:"c51.webp", i2:"c52.webp"}
        ];
        
        const mainList = document.getElementById('main-list-container');
        mainIdols.forEach(m => {
            mainList.innerHTML += `
                <div class="profile-card">
                    <div class="profile-img-box"><img id="${m.id}" src="${m.i1}"></div>
                    <div class="profile-info">
                        <h3>${m.n} (${m.a})</h3>
                        <div class="stats-grid">
                            <span class="stat-item">${m.m}</span>
                            <span class="stat-item">${m.h}</span>
                            <span class="stat-item">${m.b}</span>
                        </div>
                        <button class="swap-btn" onclick="swap('${m.id}','${m.i1}','${m.i2}')">의상 체인지! ✨</button>
                    </div>
                </div>`;
        });

        const subs = [
            {n:"펠리아", r:"비서", a:30, i:"001.webp"}, {n:"남기욱", r:"재벌", a:32, i:"002.webp"}, {n:"박승철", r:"촬영 감독", a:39, i:"003.webp"},
            {n:"양정식", r:"CEO", a:50, i:"004.webp"}, {n:"방울개", r:"작곡가", a:"?", i:"005.webp"}, {n:"루이 김", r:"디자이너", a:36, i:"006.webp"},
            {n:"엘리아", r:"EXIA", a:21, i:"007.webp"}, {n:"티라", r:"EXIA", a:21, i:"008.webp"}, {n:"파란", r:"EXIA", a:20, i:"009.webp"},
            {n:"가을", r:"EXIA", a:20, i:"010.webp"}, {n:"헤라", r:"EXIA", a:21, i:"011.webp"}, {n:"시우", r:"VIA:VOID", a:21, i:"012.webp"},
            {n:"베니", r:"VIA:VOID", a:22, i:"013.webp"}, {n:"로먼", r:"VIA:VOID", a:20, i:"014.webp"}, {n:"주안", r:"VIA:VOID", a:20, i:"015.webp"},
            {n:"아키", r:"VIA:VOID", a:22, i:"016.webp"}, {n:"여자팬", r:"EXTRA", a:"", i:"017.webp"}, {n:"남자팬", r:"EXTRA", a:"", i:"018.webp"},
            {n:"사생팬", r:"EXTRA", a:"", i:"019.webp"}, {n:"열성팬", r:"EXTRA", a:"", i:"020.webp"}
        ];
        
        const subList = document.getElementById('sub-list-container');
        subs.forEach(s => {
            const ageInfo = s.a ? `(${s.a})` : '';
            subList.innerHTML += `
                <div class="profile-card" style="border-color:var(--main-blue)">
                    <div class="profile-img-box"><img src="${s.i}"></div>
                    <div class="profile-info">
                        <h3 style="color:#6a89cc">${s.n} ${ageInfo}</h3>
                        <div class="stats-grid">
                            <span class="stat-item" style="color:#6a89cc; border-color:#e1e9f0; background:#f0f7ff">${s.r}</span>
                        </div>
                    </div>
                </div>`;
        });

        const o_data = ["연습복:a", "트레이닝복:b", "사복:c", "속옷:d", "나체:e", "속박:f", "파자마:g", "무대의상1:h", "무대의상2:i", "무대의상3:j", "무대의상4:k", "간호사복:l", "경찰복:m", "드레스:n", "바니걸:o", "비키니:p", "산타복:q", "정장:r", "올블랙정장:s", "웨딩드레스:t", "한복:u", "메이드복:v"];
        o_data.forEach(x => { const [n,c]=x.split(':'); document.getElementById('outfit-data').innerHTML += `<div style="background:#fdfdfd; padding:8px; border-radius:10px; border-left:4px solid var(--main-pink); font-size:0.9rem; display:flex; justify-content:space-between"><span>${n}</span><b>${c}</b></div>`; });
        
        const c_data = ["!팬사이트:팬사이트 확인", "!커뮤:커뮤니티 확인", "!위키:위키 사이트 확인", "!기사:연예기사 확인", "!피팅:의상 리스트 확인"];
        c_data.forEach(x => { const [n,d]=x.split(':'); document.getElementById('cmd-data').innerHTML += `<div style="margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:5px; font-size:0.9rem;"><b>${n}</b> : <span style="color:#888">${d}</span></div>`; });

        document.getElementById('volumeRange').addEventListener('input', (e) => bgm.volume = e.target.value);
    </script>
</body>
</html>
