<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이돌 플래너 - 나만의 아이돌을 빛나게 하세요!</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #FFD1DC;
            --main-blue: #AEC6CF;
            --main-purple: #DCD0FF;
            --text-color: #5D5D5D;
            --white: #ffffff;
        }

        /* --- 기본 스타일 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jua', sans-serif; }
        body { background-color: var(--main-pink); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* --- 애니메이션 --- */
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(0) rotate(15deg); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* --- 진입 오버레이 --- */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: background 0.6s ease-in-out; }
        #overlay.fade-out { background: transparent; pointer-events: none; }
        .overlay-content { text-align: center; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pop-out { animation: popOut 0.8s forwards; }
        .start-btn { padding: 22px 50px; font-size: 2.3rem; background: var(--white); color: var(--main-blue); border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #89a3ad; transition: all 0.2s ease; margin-top: 30px; }
        .start-logo-img { width: 85%; max-width: 650px; height: auto; margin-bottom: 20px; }

        /* --- 내비게이션 바 --- */
        nav { position: fixed; top: -100px; left: 0; width: 100%; height: 70px; background: rgba(255, 255, 255, 0.85); display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 1000; border-bottom: 4px solid var(--main-blue); transition: all 0.5s; backdrop-filter: blur(8px); opacity: 0; }
        nav.active-nav { top: 0; opacity: 1; }
        .nav-link { padding: 8px 18px; border-radius: 20px; cursor: pointer; color: var(--main-blue); font-size: 1.2rem; transition: 0.2s; }
        .nav-link.active { background: var(--main-blue); color: white; }

        /* --- 메인 영역 --- */
        #main-wrapper { width: 100%; max-width: 1000px; padding-top: 50px; display: none; flex-direction: column; align-items: center; }
        #main-wrapper.nav-padding { padding-top: 100px; }
        .view { display: none; width: 100%; animation: popIn 0.6s forwards; padding: 20px; }
        .view.active { display: flex; flex-direction: column; align-items: center; }

        /* --- 홈 화면 전용 --- */
        .home-logo { text-align: center; margin-bottom: 50px; width: 100%; }
        .main-logo-img { width: 95%; max-width: 750px; height: auto; animation: bounce 2s infinite; }
        .menu-grid { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; margin-bottom: 80px; width: 100%; }
        .menu-img-btn { width: 260px; cursor: pointer; border-radius: 30px; overflow: hidden; transition: 0.3s; }
        .menu-img-btn:hover { transform: scale(1.05); }
        .menu-img-btn img { width: 100%; height: auto; display: block; }

        /* --- 캐릭터 목록 구조 (핵심 수정 영역) --- */
        .char-detail-view { display: none; width: 100%; flex-direction: column; align-items: center; }
        .char-detail-view.active { display: flex; } /* 액티브 시에만 보이게 함 */
        
        .profile-list { display: flex; flex-direction: column; gap: 40px; width: 100%; align-items: center; margin-top: 30px; }
        .profile-card { width: 100%; max-width: 500px; background: white; border-radius: 40px; border: 8px solid var(--main-pink); overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .profile-img-box { width: 100%; height: 400px; background: #fffcfd; overflow: hidden; border-bottom: 6px solid var(--main-pink); }
        .profile-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .profile-info { padding: 30px; }
        .profile-info h3 { font-size: 2.2rem; color: #ff8fa3; margin-bottom: 15px; border-bottom: 2px solid #ffedf0; display: inline-block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-item { background: #fff5f7; padding: 10px 15px; border-radius: 15px; font-size: 1.1rem; border-left: 5px solid var(--main-pink); }
        .outfit-swap-btn { width: 100%; margin-top: 20px; padding: 12px; background: var(--main-pink); color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 1.2rem; }

        /* --- 콘텐츠 공통 박스 --- */
        .content-box { width: 100%; max-width: 850px; background: var(--white); padding: 40px; border-radius: 40px; border: 8px solid var(--main-pink); margin-bottom: 50px; text-align: center; }
        .list-item { background: #fdfdfd; padding: 12px; border-radius: 20px; border-left: 8px solid var(--main-pink); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { margin-top: 30px; padding: 12px 40px; background: var(--main-pink); color: white; border: none; border-radius: 35px; cursor: pointer; font-size: 1.2rem; }

        /* --- 볼륨 조절 --- */
        .volume-container { position: fixed; bottom: 25px; right: 25px; background: rgba(255, 255, 255, 0.6); padding: 10px 20px; border-radius: 40px; display: flex; align-items: center; gap: 10px; z-index: 100; border: 3px solid var(--main-pink); opacity: 0; transition: 1s; }
        body.loaded .volume-container { opacity: 1; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="overlay-content" id="overlayText">
            <img src="logo.webp" class="start-logo-img">
            <button class="start-btn" id="startBtn">START!</button>
        </div>
    </div>

    <nav id="nav-bar">
        <div class="nav-link" onclick="showView('view-home')">HOME</div>
        <div class="nav-link" onclick="showView('view-char')">캐릭터 목록</div>
        <div class="nav-link" onclick="showView('view-outfit')">의상 목록</div>
        <div class="nav-link" onclick="showView('view-cmd')">명령어 목록</div>
    </nav>

    <audio id="bgm" loop><source src="cute_bgm.mp3" type="audio/mpeg"></audio>
    <audio id="startSfx"><source src="inside.mp3" type="audio/mpeg"></audio>
    <audio id="clickSfx"><source src="click.mp3" type="audio/mpeg"></audio>

    <div class="volume-container">
        <span id="muteBtn">🎵</span>
        <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="0.5">
    </div>

    <main id="main-wrapper">
        <div id="view-home" class="view active">
            <div class="home-logo">
                <img src="logo.webp" class="main-logo-img">
                <p style="color:white; background:rgba(0,0,0,0.1); padding:5px 20px; border-radius:20px; display:inline-block; margin-top:10px;">제작자: 아루이 / 플랫폼: 크랙</p>
            </div>
            <div class="menu-grid">
                <div class="menu-img-btn" onclick="showView('view-char')"><img src="a.png"></div>
                <div class="menu-img-btn" onclick="showView('view-outfit')"><img src="c.png"></div>
                <div class="menu-img-btn" onclick="showView('view-cmd')"><img src="b.png"></div>
            </div>
        </div>

        <div id="view-char" class="view">
            
            <div id="char-category-view" class="content-box">
                <h2 style="color: var(--main-pink); margin-bottom: 30px; font-size: 2.5rem;">💖 캐릭터 분류 선택</h2>
                <div style="display:flex; flex-direction:column; gap:20px;">
                    <div onclick="openCharDetail('main')" style="background:var(--main-pink); color:white; padding:40px; border-radius:30px; font-size:2.5rem; cursor:pointer;">MAIN IDOLS</div>
                    <div onclick="openCharDetail('sub')" style="background:var(--main-blue); color:white; padding:40px; border-radius:30px; font-size:2.5rem; cursor:pointer;">SUB CHARACTERS</div>
                </div>
                <button class="back-btn" onclick="showView('view-home')">메인으로</button>
            </div>

            <div id="char-detail-main" class="char-detail-view content-box">
                <h2 style="color: var(--main-pink); font-size: 2.5rem;">🌟 MAIN IDOLS</h2>
                <div class="profile-list">
                    <div class="profile-card">
                        <div class="profile-img-box"><img id="img-yuri" src="c11.webp"></div>
                        <div class="profile-info"><h3>임유리 (21)</h3><div class="stats-grid"><div class="stat-item">ISTJ</div><div class="stat-item">168cm</div><div class="stat-item">C컵</div></div>
                        <button class="outfit-swap-btn" onclick="swapOutfit('img-yuri', 'c11.webp', 'c12.webp')">의상 체인지! ✨</button></div>
                    </div>
                    </div>
                <button class="back-btn" onclick="closeCharDetail()">뒤로가기</button>
            </div>

            <div id="char-detail-sub" class="char-detail-view content-box" style="border-color: var(--main-blue);">
                <h2 style="color: var(--main-blue); font-size: 2.5rem;">✨ SUB CHARACTERS</h2>
                <div class="profile-list" id="sub-list-container">
                    </div>
                <button class="back-btn" onclick="closeCharDetail()" style="background:var(--main-blue)">뒤로가기</button>
            </div>
        </div>

        <div id="view-outfit" class="view"><div class="content-box"><h2>👗 의상 목록</h2><div id="outfit-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;"></div><button class="back-btn" onclick="showView('view-home')">메인으로</button></div></div>
        
        <div id="view-cmd" class="view"><div class="content-box"><h2>⌨️ 명령어 목록</h2><div id="cmd-list" style="text-align:left; margin-top:20px;"></div><button class="back-btn" onclick="showView('view-home')">메인으로</button></div></div>

        <footer style="color:white; padding: 40px 0;">&copy; 2026 Idol Planner Project.</footer>
    </main>

    <script>
        const bgm = document.getElementById('bgm');
        const startSfx = document.getElementById('startSfx');
        const clickSfx = document.getElementById('clickSfx');
        const mainWrapper = document.getElementById('main-wrapper');

        function playClick() { clickSfx.currentTime = 0; clickSfx.play().catch(e=>{}); }

        // [화면 전환 로직]
        function showView(viewId) {
            playClick();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            
            // 캐릭터 탭 진입 시 초기화
            if(viewId === 'view-char') {
                document.getElementById('char-category-view').style.display = 'block';
                document.querySelectorAll('.char-detail-view').forEach(v => v.classList.remove('active'));
            }

            if(viewId === 'view-home') { document.getElementById('nav-bar').classList.remove('active-nav'); mainWrapper.classList.remove('nav-padding'); }
            else { document.getElementById('nav-bar').classList.add('active-nav'); mainWrapper.classList.add('nav-padding'); }

            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0,0);
        }

        // [캐릭터 상세 열기/닫기]
        function openCharDetail(type) {
            playClick();
            document.getElementById('char-category-view').style.display = 'none';
            document.getElementById('char-detail-' + type).classList.add('active');
            window.scrollTo(0,0);
        }

        function closeCharDetail() {
            playClick();
            document.querySelectorAll('.char-detail-view').forEach(v => v.classList.remove('active'));
            document.getElementById('char-category-view').style.display = 'block';
        }

        // [메인 의상 교체]
        function swapOutfit(id, o, a) {
            playClick();
            const img = document.getElementById(id);
            img.src = img.src.includes(o) ? a : o;
        }

        // [시작 버튼]
        document.getElementById('startBtn').addEventListener('click', () => {
            playClick(); startSfx.play(); bgm.play();
            document.getElementById('overlayText').classList.add('pop-out');
            setTimeout(() => {
                document.getElementById('overlay').classList.add('fade-out');
                mainWrapper.style.display = 'flex';
                document.body.classList.add('loaded');
            }, 800);
        });

        // [데이터 생성: 서브 캐릭터 20명]
        const subData = [
            {n:"펠리아 (30)", r:"비서", i:"001.webp"}, {n:"남기욱 (32)", r:"재벌", i:"002.webp"}, {n:"박승철 (39)", r:"촬영 감독", i:"003.webp"},
            {n:"양정식 (50)", r:"기획사 CEO", i:"004.webp"}, {n:"방울개 (?)", r:"작곡가", i:"005.webp"}, {n:"루이 김 (36)", r:"디자이너", i:"006.webp"},
            {n:"엘리아 (21)", r:"EXIA", i:"007.webp"}, {n:"티라 (21)", r:"EXIA", i:"008.webp"}, {n:"파란 (20)", r:"EXIA", i:"009.webp"},
            {n:"가을 (20)", r:"EXIA", i:"010.webp"}, {n:"헤라 (21)", r:"EXIA", i:"011.webp"}, {n:"시우 (21)", r:"VIA:VOID", i:"012.webp"},
            {n:"베니 (22)", r:"VIA:VOID", i:"013.webp"}, {n:"로먼 (20)", r:"VIA:VOID", i:"014.webp"}, {n:"주안 (20)", r:"VIA:VOID", i:"015.webp"},
            {n:"아키 (22)", r:"VIA:VOID", i:"016.webp"}, {n:"여자팬", r:"EXTRA", i:"017.webp"}, {n:"남자팬", r:"EXTRA", i:"018.webp"},
            {n:"사생팬", r:"EXTRA", i:"019.webp"}, {n:"열성팬", r:"EXTRA", i:"020.webp"}
        ];
        const subContainer = document.getElementById('sub-list-container');
        subData.forEach(s => {
            subContainer.innerHTML += `<div class="profile-card" style="border-color:var(--main-blue)"><div class="profile-img-box"><img src="${s.i}"></div><div class="profile-info"><h3 style="color:#6a89cc">${s.n}</h3><div class="stat-item" style="border-left-color:var(--main-blue)">역할: ${s.r}</div></div></div>`;
        });

        // 의상 및 명령어 목록
        const outfits = ["연습복:a", "트레이닝복:b", "사복:c", "속옷:d", "나체:e", "파자마:g", "무대의상1:h", "비키니:p", "메이드복:v"];
        outfits.forEach(o => { const [n, c] = o.split(':'); document.getElementById('outfit-grid').innerHTML += `<div class="list-item"><span>${n}</span><b>${c}</b></div>`; });
        const cmds = ["!팬사이트:팬 사이트 열람", "!커뮤:커뮤니티 열람", "!위키:위키 열람", "!기사:기사 열람", "!피팅:의상 확인"];
        cmds.forEach(c => { const [n, d] = c.split(':'); document.getElementById('cmd-list').innerHTML += `<div class="list-item"><span>${n}</span><small>${d}</small></div>`; });

        // 볼륨
        document.getElementById('volumeRange').addEventListener('input', (e) => bgm.volume = e.target.value);
    </script>
</body>
</html>
