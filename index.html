<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이돌 플래너 - 나만의 아이돌을 빛나게 하세요!</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-pink: #FFD1DC;
            --main-blue: #AEC6CF;
            --main-purple: #DCD0FF;
            --soft-yellow: #FFF9C4;
            --text-color: #5D5D5D;
            --white: #ffffff;
        }

        /* --- 기본 스타일 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Jua', sans-serif; }
        body { background-color: var(--main-pink); color: var(--text-color); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* --- 애니메이션 정의 --- */
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(0) rotate(15deg); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }
        /* 클릭 시 반짝이는 플래시 효과 */
        @keyframes flashEffect {
            0% { opacity: 0; }
            50% { opacity: 0.8; background: rgba(255, 255, 255, 0.9); }
            100% { opacity: 0; }
        }

        /* --- 진입 오버레이 --- */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; transition: background 0.6s ease-in-out; }
        #overlay.fade-out { background: transparent; pointer-events: none; }
        .overlay-content { text-align: center; transform-origin: center center; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .pop-out { animation: popOut 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }
        .start-btn { padding: 22px 50px; font-size: 2.3rem; background: var(--white); color: var(--main-blue); border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 0 #89a3ad; transition: all 0.2s ease; margin-top: 30px; -webkit-tap-highlight-color: transparent; }
        .start-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #89a3ad; }
        .start-logo-img { width: 80%; max-width: 500px; height: auto; margin-bottom: 20px; }

        /* --- 내비게이션 바 --- */
        nav { position: fixed; top: -100px; left: 0; width: 100%; height: 70px; background: rgba(255, 255, 255, 0.95); display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 1000; border-bottom: 4px solid var(--main-blue); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; }
        nav.active-nav { top: 0; opacity: 1; pointer-events: auto; }
        .nav-link { padding: 8px 18px; border-radius: 20px; cursor: pointer; color: var(--main-blue); font-size: 1.2rem; transition: all 0.2s; }
        .nav-link:hover { background: var(--main-pink); color: white; }
        .nav-link.active { background: var(--main-blue); color: white; }

        /* --- 메인 영역 --- */
        #main-wrapper { width: 100%; max-width: 1000px; padding-top: 50px; display: none; flex-direction: column; align-items: center; transition: padding-top 0.5s ease; }
        #main-wrapper.nav-padding { padding-top: 100px; }
        .view { display: none; width: 100%; animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; padding: 20px; }
        .view.active { display: flex; flex-direction: column; align-items: center; }

        /* --- 홈 화면 스타일 --- */
        .home-logo { text-align: center; margin-bottom: 50px; display: flex; flex-direction: column; align-items: center; }
        .main-logo-img { width: 90%; max-width: 600px; height: auto; margin-bottom: 20px; animation: bounce 2s infinite; }
        .info-tag { font-size: 1.2rem; color: white; background: rgba(0,0,0,0.1); padding: 5px 20px; border-radius: 20px; display: inline-block; margin-top: 15px; }
        
        /* 메뉴 그리드 및 이미지 버튼 스타일 */
        .menu-grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; margin-bottom: 80px; width: 100%; }
        
        /* 이미지 버튼 컨테이너 (반짝임 효과를 위한 기준점) */
        .menu-img-btn {
            position: relative; /* 플래시 효과 오버레이의 기준 */
            width: 280px;
            cursor: pointer;
            border-radius: 30px; /* 이미지 둥근 모서리에 맞춤 (필요시 조절) */
            overflow: hidden; /* 플래시가 밖으로 나가지 않게 */
            transition: transform 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 실제 메뉴 이미지 */
        .menu-img-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 호버 시 살짝 커지는 효과 */
        .menu-img-btn:hover {
            transform: scale(1.05);
        }

        /* 반짝이는 플래시 오버레이 (가상 요소) */
        .menu-img-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            opacity: 0;
            pointer-events: none; /* 클릭이 통과되도록 */
        }

        /* 클릭(active) 또는 호버 시 반짝임 애니메이션 실행 */
        .menu-img-btn:active::after,
        .menu-img-btn:hover::after {
            animation: flashEffect 0.4s ease-out;
        }

        /* --- 콘텐츠 박스 --- */
        .content-box { width: 100%; max-width: 800px; background: var(--white); padding: 50px; border-radius: 40px; border: 8px solid var(--main-pink); margin-bottom: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .outfit-notice { background: #fff0f3; color: #d88a9a; padding: 15px; border-radius: 15px; margin-bottom: 25px; text-align: center; font-size: 1.1rem; border: 2px dashed var(--main-pink); }
        .outfit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; width: 100%; }
        .list-item { background: #fdfdfd; padding: 12px 18px; border-radius: 20px; border-left: 8px solid var(--main-pink); display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; }
        .icon-box { width: 45px; height: 45px; background: #eee; border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; overflow: hidden; }
        .item-info { flex-grow: 1; display: flex; justify-content: space-between; align-items: center; }
        .item-name { color: #d88a9a; font-weight: bold; font-size: 1.1rem; }
        .item-code { background: var(--soft-yellow); color: #888; padding: 2px 10px; border-radius: 10px; font-size: 0.9rem; }
        .list-group h3 { background: var(--main-blue); color: white; display: inline-block; padding: 6px 18px; border-radius: 12px; margin-bottom: 20px; font-size: 1.4rem; margin-top: 30px; }

        /* --- 기타 요소 --- */
        .volume-container { position: fixed; bottom: 25px; right: 25px; background: var(--white); padding: 12px 25px; border-radius: 40px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); z-index: 100; border: 3px solid var(--main-pink); opacity: 0; transition: opacity 1s; }
        body.loaded .volume-container { opacity: 1; }
        .bg-circle { position: fixed; z-index: -1; border-radius: 50%; background: var(--white); opacity: 0.4; animation: float 8s infinite ease-in-out; }
        .back-btn { margin-top: 30px; padding: 12px 40px; background: var(--main-pink); color: white; border: none; border-radius: 35px; cursor: pointer; font-size: 1.3rem; transition: transform 0.2s; }
        .back-btn:hover { transform: scale(1.1); background: var(--main-blue); }

        /* --- 모바일 반응형 --- */
        @media (max-width: 768px) {
            /* 태블릿/모바일에서 이미지 버튼 크기 조절 */
            .menu-img-btn { width: 100%; max-width: 350px; }
            .nav-link { font-size: 1rem; padding: 5px 12px; }
            .main-logo-img { max-width: 450px; }
        }
        @media (max-width: 480px) {
            .home-logo p { font-size: 1.2rem; }
            .start-btn { font-size: 1.8rem; padding: 15px 40px; }
            .content-box { padding: 30px 15px; }
            .content-box h2 { font-size: 2rem !important; }
            .outfit-grid { grid-template-columns: 1fr; }
            .volume-container { bottom: 15px; right: 15px; padding: 10px 15px; }
            nav { gap: 8px; }
            .nav-link { font-size: 0.9rem; padding: 4px 8px; }
            .main-logo-img { max-width: 300px; margin-bottom: 10px; }
            .start-logo-img { max-width: 280px; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="overlay-content" id="overlayText">
            <img src="logo.png" alt="아이돌 플래너 로고" class="start-logo-img">
            <button class="start-btn" id="startBtn">START!</button>
        </div>
    </div>

    <nav id="nav-bar">
        <div class="nav-link" onclick="showView('view-home')">HOME</div>
        <div class="nav-link" onclick="showView('view-char')">캐릭터 목록</div>
        <div class="nav-link" onclick="showView('view-outfit')">의상 목록</div>
        <div class="nav-link" onclick="showView('view-cmd')">명령어 목록</div>
    </nav>

    <audio id="bgm" loop preload="auto"><source src="cute_bgm.mp3" type="audio/mpeg"></audio>
    <audio id="startSfx" preload="auto"><source src="inside.mp3" type="audio/mpeg"></audio>

    <div class="volume-container">
        <span>🎵</span>
        <input type="range" id="volumeRange" min="0" max="1" step="0.01" value="0.6">
    </div>

    <div class="bg-circle" style="width: 300px; height: 300px; top: -50px; left: -50px;"></div>
    <div class="bg-circle" style="width: 200px; height: 200px; bottom: -50px; right: -50px; background: var(--main-purple);"></div>

    <main id="main-wrapper">
        
        <div id="view-home" class="view active">
            <div class="home-logo">
                <img src="logo.png" alt="아이돌 플래너 로고" class="main-logo-img">
                <p style="font-size: 1.8rem; color: white;">🌸 프로듀서님, 환영합니다! 🌸</p>
                <div class="info-tag">제작자: 아루이 / 플랫폼: 크랙</div>
            </div>
            
            <div class="menu-grid">
                <div class="menu-img-btn" onclick="showView('view-char')">
                    <img src="a.png" alt="캐릭터 목록">
                </div>
                <div class="menu-img-btn" onclick="showView('view-outfit')">
                    <img src="c.png" alt="의상 목록">
                </div>
                <div class="menu-img-btn" onclick="showView('view-cmd')">
                    <img src="b.png" alt="명령어 목록">
                </div>
            </div>
        </div>

        <div id="view-char" class="view">
            <div class="content-box">
                <h2 style="color: var(--main-pink); margin-bottom: 30px; font-size: 2.8rem;">💖 캐릭터 목록</h2>
                <p style="font-size: 1.6rem; color: #888; background: #fffafb; padding: 40px; border-radius: 20px; border: 2px dashed #ffd1dc;">*여기에 특징 작성 예정*</p>
                <button class="back-btn" onclick="showView('view-home')">홈으로 돌아가기</button>
            </div>
        </div>

        <div id="view-outfit" class="view">
            <div class="content-box" style="border-color: var(--soft-yellow);">
                <h2 style="color: #ecbd00; margin-bottom: 20px; font-size: 2.8rem;">👗 의상 목록</h2>
                <div class="outfit-notice">✨ 알파벳은 링크에 사용되는 의상코드를 의미합니다! ✨</div>
                <div class="outfit-grid">
                    <div class="list-item"><div class="icon-box" style="background: #e1f5fe;"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2L4 5v14l8 3 8-3V5l-8-3zm0 2.18L18 6.5v11.32l-6 2.25-6-2.25V6.5l6-2.32z" fill="#03a9f4"/></svg></div><div class="item-info"><span class="item-name">연습복</span><span class="item-code">a</span></div></div>
                    <div class="list-item"><div class="icon-box" style="background:#fce4ec"><span style="font-size:20px">🧹</span></div><div class="item-info"><span class="item-name">메이드복</span><span class="item-code">v</span></div></div>
                </div>
                <button class="back-btn" onclick="showView('view-home')" style="background-color: #ecbd00;">홈으로 돌아가기</button>
            </div>
        </div>

        <div id="view-cmd" class="view">
            <div class="content-box" style="border-color: var(--main-blue);">
                <h2 style="color: var(--main-blue); margin-bottom: 40px; font-size: 2.8rem;">⌨️ 명령어 목록</h2>
                <div class="list-group">
                    <h3># 스챗 진행 관련</h3>
                    <div class="list-item"><div class="item-info"><span class="item-name">!팬사이트</span><span class="item-desc">팬 사이트 열람</span></div></div>
                    <div class="list-item"><div class="item-info"><span class="item-name">!피팅</span><span class="item-desc">의상 목록 확인</span></div></div>
                </div>
                <div class="list-group">
                    <h3># 디버그 관련</h3>
                    <div class="list-item"><div class="item-info"><span class="item-name">!이미지</span><span class="item-desc">이미지 오류 시 디버그 명령어</span></div></div>
                </div>
                <button class="back-btn" onclick="showView('view-home')" style="background-color: var(--main-blue);">홈으로 돌아가기</button>
            </div>
        </div>
        <footer style="color:white; padding: 60px 0;">&copy; 2026 Idol Planner Project. All Rights Reserved.</footer>
    </main>

    <script>
        const bgm = document.getElementById('bgm');
        const startSfx = document.getElementById('startSfx');
        const volumeRange = document.getElementById('volumeRange');
        const navBar = document.getElementById('nav-bar');
        const mainWrapper = document.getElementById('main-wrapper');
        const startBtn = document.getElementById('startBtn');

        bgm.volume = 0.6;
        startSfx.volume = 1.0;

        // [모바일 강제 활성화] 클릭 시 오디오 잠금 해제
        startBtn.addEventListener('click', function() {
            startSfx.play().catch(e => console.log("SFX 재생 안됨"));
            bgm.play().catch(e => console.log("BGM 재생 안됨"));

            const overlayText = document.getElementById('overlayText');
            overlayText.classList.add('pop-out');

            setTimeout(() => {
                document.getElementById('overlay').classList.add('fade-out');
                mainWrapper.style.display = 'flex';
                document.body.classList.add('loaded');
                setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 700);
            }, 800);
        });

        volumeRange.addEventListener('input', (e) => { bgm.volume = e.target.value; });

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));

            if (viewId === 'view-home') {
                navBar.classList.remove('active-nav');
                mainWrapper.classList.remove('nav-padding');
            } else {
                navBar.classList.add('active-nav');
                mainWrapper.classList.add('nav-padding');
            }

            document.getElementById(viewId).classList.add('active');
            const activeLink = document.querySelector(`.nav-link[onclick="showView('${viewId}')"]`);
            if(activeLink) activeLink.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
